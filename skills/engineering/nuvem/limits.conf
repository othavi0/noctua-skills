# Defaults in US$ cents. Override any of them in ~/.config/nuvem/limits.conf,
# which an update of this skill never touches.
#
# MONTHLY_CREDIT_CENTS: the API credit your plan grants each month. The skill never
#   commits past it.
# CONSOLE_LIMIT_CENTS: mirrors "Monthly spend limit" at
#   https://platform.claude.com/settings/spend-limits. The Console blocks every API
#   call past it, credit-paid ones included.
# EXTERNAL_SPEND_CENTS: API use this month outside Managed Agents, which a regular
#   key cannot list. Set it from the Console's "Spend" before each batch.
MONTHLY_CREDIT_CENTS=0
CONSOLE_LIMIT_CENTS=0
MARGIN_CENTS=1000
SESSION_CAP_CENTS=600
EXTERNAL_SPEND_CENTS=0
MODEL=claude-sonnet-5-5
# Hosts the container may reach besides the package registries.
ALLOWED_HOSTS=(fonts.googleapis.com fonts.gstatic.com cdn.playwright.dev playwright.download.prss.microsoft.com playwright.azureedge.net)
